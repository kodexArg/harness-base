<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness agents &amp; delivery party · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Harness</p>
    <h1>Agents, guardians &amp; the delivery party</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="harness-party-title harness-party-desc">
      <title id="harness-party-title">Harness agents and delivery party</title>
      <desc id="harness-party-desc">Architecture showing interactive hb-ag area owners, kbot guardians, and kwf delivery-party workflow nodes converging on SSOT and product code.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="32" y="116" width="600" height="112" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="248" y="120" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="129" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">INTERACTIVE SESSION</text>

      <rect x="32" y="268" width="440" height="112" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="176" y="272" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="281" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">BATCH WORKFLOW</text>

      <!-- Arrows (behind nodes) -->
      <!-- Parent → hb-ag -->
      <line x1="176" y1="180" x2="220" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- hb-ag → SSOT -->
      <path d="M 412,180 H 640 Q 648,180 648,188 V 228"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- kbot → SSOT -->
      <path d="M 536,212 V 228"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Party script → kwf -->
      <line x1="208" y1="328" x2="248" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- kwf → SSOT (dashed batch path) -->
      <path d="M 440,328 H 640 Q 648,328 648,320 V 296"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="180" y="160" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="202" y="170" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISPATCH</text>

      <rect x="520" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="170" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>

      <rect x="520" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>

      <rect x="216" y="308" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>

      <rect x="520" y="308" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>

      <!-- Node: Parent session -->
      <rect x="48" y="148" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="148" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="70" y="165" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="112" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parent session</text>
      <text x="112" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cursor · Claude</text>

      <!-- Node: hb-ag area owners (focal) -->
      <rect x="220" y="148" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="148" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="228" y="156" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="246" y="165" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
      <text x="316" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Area owners</text>
      <text x="316" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hb-ag-* · Cleric·Dwarf·Elf…</text>

      <!-- Node: kbot guardians -->
      <rect x="464" y="148" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="148" width="144" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="472" y="156" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="488" y="165" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="536" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guardians</text>
      <text x="536" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kbot-prd·adr·api</text>

      <!-- Node: SSOT + code -->
      <rect x="672" y="200" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="200" width="160" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="680" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="698" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSOT</text>
      <text x="752" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contracts &amp; code</text>
      <text x="752" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PRD · INTERFACES</text>
      <text x="752" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">service · surface trees</text>

      <!-- Node: Party script -->
      <rect x="48" y="296" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="296" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="304" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="72" y="313" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAG</text>
      <text x="128" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Party script</text>
      <text x="128" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agents-team-party</text>

      <!-- Node: kwf delivery party -->
      <rect x="248" y="296" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="296" width="192" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="256" y="304" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="274" y="313" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BATCH</text>
      <text x="344" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delivery party</text>
      <text x="344" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kwf-warrior·archer·bard…</text>

      <!-- Legend -->
      <line x1="32" y1="420" x2="968" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="452" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="52" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Live model (hb-ag)</text>

      <rect x="180" y="452" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="200" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guardian gate</text>

      <rect x="320" y="452" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="340" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Batch workflow (kwf)</text>

      <line x1="480" y1="458" x2="508" y2="458" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary interactive path</text>

      <line x1="720" y1="458" x2="748" y2="458" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="756" y="460" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Script-orchestrated delivery</text>
    </svg>
  </div>
</body>
</html>
